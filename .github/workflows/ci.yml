name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # The opt-in Imagick renderer is only verified against ImageMagick 6 so far (runners ship 7), see issue #1
          extensions: :imagick
          ini-values: error_reporting=-1, display_errors=1
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
